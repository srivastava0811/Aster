<div class="p-8 space-y-8 max-w-7xl mx-auto">
  <!-- Page Header -->
  <div class="bg-aster-card p-6 rounded-2xl border border-aster-theme shadow-xl flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-white tracking-tight font-heading flex items-center gap-2">
        <span>Workspace Settings & Preferences</span>
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-aster-dynamic-light text-aster-dynamic border border-aster-dynamic">System Hub</span>
      </h1>
      <p class="text-sm text-slate-400 mt-1">Configure account security, semester boundaries, smart reminder alerts, AI syllabus parsing defaults, and app-wide theme colors.</p>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="py-16 flex flex-col items-center justify-center space-y-3 bg-aster-card rounded-2xl border border-aster-theme">
    <div class="w-8 h-8 border-4 border-aster-dynamic border-t-transparent rounded-full animate-spin"></div>
    <span class="text-xs font-semibold text-slate-400">Loading settings configuration...</span>
  </div>

  <!-- Main Settings Workspace (Vertical Menu + Content Area) -->
  <div *ngIf="!isLoading" class="grid grid-cols-1 lg:grid-cols-4 gap-8 items-start">
    
    <!-- Left-aligned Inner Vertical Menu Navigation Container -->
    <nav class="lg:col-span-1 bg-aster-card p-5 rounded-2xl border border-aster-theme shadow-xl space-y-3">
      <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wider px-2 mb-2 flex items-center justify-between">
        <span>Settings Modules</span>
        <span class="text-[10px] text-slate-500 font-mono">5 Options</span>
      </div>
      
      <button *ngFor="let item of menuItems"
              (click)="selectCategory(item.id)"
              type="button"
              [ngClass]="activeCategory === item.id ? 'bg-aster-dynamic text-white shadow-lg shadow-aster-dynamic font-bold ring-1 ring-white/20' : 'bg-aster-input text-slate-300 hover:bg-white/5 hover:translate-x-1'"
              class="w-full text-left p-4 rounded-xl border border-aster-theme transition-all duration-200 flex items-center space-x-3.5 group">
        
        <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 transition-transform"
             [ngClass]="activeCategory === item.id ? 'bg-white/20 text-white' : 'bg-aster-dynamic-light text-aster-dynamic group-hover:scale-105'">
          <span class="material-icons text-xl">{{ item.icon }}</span>
        </div>

        <div class="truncate">
          <div class="text-sm font-bold leading-tight font-heading">{{ item.label }}</div>
          <div class="text-[11px] font-medium truncate mt-1" 
               [ngClass]="activeCategory === item.id ? 'text-white/80' : 'text-slate-400'">
            {{ item.description }}
          </div>
        </div>
      </button>
    </nav>

    <!-- Right-hand Content Area Panel -->
    <main class="lg:col-span-3">
      <app-account-settings 
        *ngIf="activeCategory === 'account'" 
        [settings]="settings">
      </app-account-settings>

      <app-academic-preferences 
        *ngIf="activeCategory === 'academic'" 
        [settings]="settings">
      </app-academic-preferences>

      <app-notification-settings 
        *ngIf="activeCategory === 'notifications'" 
        [settings]="settings">
      </app-notification-settings>

      <app-injection-settings 
        *ngIf="activeCategory === 'injection'" 
        [settings]="settings">
      </app-injection-settings>

      <app-theme-settings 
        *ngIf="activeCategory === 'theme'">
      </app-theme-settings>
    </main>
  </div>
</div>
