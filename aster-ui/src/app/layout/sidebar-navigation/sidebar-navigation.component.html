<aside [ngClass]="isCollapsed ? 'w-20' : 'w-64'" class="bg-aster-sidebar border-r border-aster-theme h-screen flex flex-col justify-between select-none shadow-xl z-20 transition-all duration-300 relative">
  <!-- Brand & Header -->
  <div>
    <div class="border-b border-aster-theme flex items-center transition-all" [ngClass]="isCollapsed ? 'p-4 justify-center' : 'p-5 justify-between space-x-3'">
      <div class="flex items-center space-x-3 truncate">
        <!-- Logo Box: Clickable to expand when collapsed, hover shows menu_open icon -->
        <div (click)="isCollapsed ? toggleCollapse() : null"
             [title]="isCollapsed ? 'Expand Sidebar' : ''"
             [ngClass]="isCollapsed ? 'cursor-pointer hover:scale-105 transition-all' : ''"
             class="w-9 h-9 rounded-xl bg-aster-dynamic flex items-center justify-center text-white font-bold text-xl shadow-md shadow-aster-dynamic flex-shrink-0 group/logo relative">
          
          <!-- Letter A -->
          <span [ngClass]="isCollapsed ? 'group-hover/logo:opacity-0 transition-opacity duration-200' : ''">A</span>

          <!-- Expand icon on hover in collapsed mode -->
          <span *ngIf="isCollapsed" class="material-icons text-xl absolute inset-0 flex items-center justify-center opacity-0 group-hover/logo:opacity-100 transition-opacity duration-200">
            menu_open
          </span>
        </div>

        <div *ngIf="!isCollapsed" class="truncate">
          <h1 class="text-xl font-bold text-white tracking-tight font-heading">Aster</h1>
          <p class="text-xs text-slate-400 font-medium">Academic Workspace</p>
        </div>
      </div>

      <!-- Collapse toggle button (visible in expanded mode) -->
      <button *ngIf="!isCollapsed" 
              (click)="toggleCollapse()" 
              title="Collapse Sidebar" 
              class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-white/10 transition-colors flex items-center justify-center cursor-pointer">
        <span class="material-icons text-lg">chevron_left</span>
      </button>
    </div>

    <!-- Static Navigation Links -->
    <div class="px-3 py-5 space-y-1">
      <div *ngIf="!isCollapsed" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider px-3 mb-2">Main Menu</div>
      
      <a routerLink="/dashboard" 
         routerLinkActive="bg-aster-dynamic-light text-white font-semibold border-l-2 border-aster-dynamic" 
         [title]="isCollapsed ? 'Dashboard Calendar' : ''"
         [ngClass]="isCollapsed ? 'justify-center px-0' : 'px-3 space-x-3'"
         class="flex items-center py-2.5 rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-all text-sm font-medium">
        <span class="material-icons text-lg text-aster-dynamic">calendar_today</span>
        <span *ngIf="!isCollapsed">Dashboard Calendar</span>
      </a>

      <a routerLink="/classes" 
         routerLinkActive="bg-aster-dynamic-light text-white font-semibold border-l-2 border-aster-dynamic" 
         [title]="isCollapsed ? 'Course Management' : ''"
         [ngClass]="isCollapsed ? 'justify-center px-0' : 'px-3 space-x-3'"
         class="flex items-center py-2.5 rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-all text-sm font-medium">
        <span class="material-icons text-lg text-aster-dynamic">school</span>
        <span *ngIf="!isCollapsed">Course Management</span>
      </a>

      <a routerLink="/settings" 
         routerLinkActive="bg-aster-dynamic-light text-white font-semibold border-l-2 border-aster-dynamic" 
         [title]="isCollapsed ? 'Workspace Settings' : ''"
         [ngClass]="isCollapsed ? 'justify-center px-0' : 'px-3 space-x-3'"
         class="flex items-center py-2.5 rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-all text-sm font-medium">
        <span class="material-icons text-lg text-aster-dynamic">settings</span>
        <span *ngIf="!isCollapsed">Workspace Settings</span>
      </a>
    </div>

    <!-- Course Dynamic Injection List -->
    <div class="px-3 py-3 border-t border-aster-theme">
      <div *ngIf="!isCollapsed" class="flex items-center justify-between px-3 mb-2">
        <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Courses & Syllabus</span>
        <a routerLink="/classes" class="text-xs text-aster-dynamic hover:underline font-semibold">+ Add</a>
      </div>

      <div class="space-y-1 max-h-60 overflow-y-auto pr-1">
        <div *ngIf="courses.length === 0 && !isCollapsed" class="px-3 py-2 text-xs text-slate-500 italic">
          No courses added yet.
        </div>

        <a *ngFor="let course of courses" 
           [routerLink]="['/classes', course.id, 'inject']"
           routerLinkActive="bg-white/10 text-white font-semibold"
           [title]="course.name"
           [ngClass]="isCollapsed ? 'justify-center px-0' : 'px-3 justify-between'"
           class="flex items-center py-2 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-white/5 transition-all text-sm group">
          <div class="flex items-center space-x-2.5 truncate">
            <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" [style.backgroundColor]="course.colorCode"></span>
            <span *ngIf="!isCollapsed" class="truncate text-xs font-medium">{{ course.name }}</span>
          </div>
          <span *ngIf="!isCollapsed" class="material-icons text-xs text-slate-500 group-hover:text-aster-dynamic transition-colors opacity-0 group-hover:opacity-100">post_add</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Footer Profile & Logout -->
  <div class="p-3 border-t border-aster-theme bg-black/20">
    <div class="flex items-center" [ngClass]="isCollapsed ? 'flex-col space-y-3' : 'justify-between'">
      <div class="flex items-center space-x-3 truncate">
        <div class="w-8 h-8 rounded-full bg-aster-dynamic-light text-white border border-aster-dynamic flex items-center justify-center font-bold text-xs flex-shrink-0" [title]="userEmail">
          {{ userEmail ? userEmail[0].toUpperCase() : 'U' }}
        </div>
        <div *ngIf="!isCollapsed" class="truncate">
          <p class="text-xs font-semibold text-slate-200 truncate">{{ userEmail }}</p>
          <span class="inline-flex items-center text-[10px] text-teal-400 font-medium bg-teal-500/10 border border-teal-500/20 px-1.5 py-0.5 rounded">Active</span>
        </div>
      </div>
      
      <button (click)="logout()" title="Sign out" class="text-slate-500 hover:text-rose-400 transition-colors p-1.5 rounded-lg hover:bg-rose-500/10 cursor-pointer">
        <span class="material-icons text-lg">logout</span>
      </button>
    </div>
  </div>
</aside>
